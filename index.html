
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assamese Auto-Transcription | অসমীয়া স্বয়ংক্ৰিয় লিপ্যন্তৰণ</title>
    <meta name="description" content="AI-powered Assamese speech and video transcription with dual-language English translation." />

    <!-- Google Fonts: Inter & Noto Sans Bengali for authentic Assamese script support -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              'sans': ['Inter', 'system-ui', 'sans-serif'],
              'display': ['Outfit', 'sans-serif'],
              'assamese': ['"Noto Sans Bengali"', 'Inter', 'sans-serif'],
            },
            colors: {
              primary: '#6366f1',
              secondary: '#8b5cf6',
              accent: '#06b6d4',
              neutral: '#111827',
              'base-100': '#090d16',
              'base-200': '#0f172a',
              'base-300': '#1e293b',
              info: '#38bdf8',
              success: '#10b981',
              warning: '#f59e0b',
              error: '#ef4444',
            },
            animation: {
              'fade-in': 'fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1)',
              'slide-up': 'slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1)',
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'glow': 'glow 2s ease-in-out infinite alternate',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'scale(0.98)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
              slideUp: {
                '0%': { transform: 'translateY(12px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              glow: {
                '0%': { boxShadow: '0 0 15px rgba(99, 102, 241, 0.3)' },
                '100%': { boxShadow: '0 0 30px rgba(139, 92, 246, 0.6)' },
              }
            }
          },
        },
      }
    </script>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body class="bg-gradient-to-br from-[#070b14] via-[#0f172a] to-[#070b14] text-gray-100 font-sans antialiased h-screen max-h-screen overflow-hidden selection:bg-purple-600/30 selection:text-purple-200">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
